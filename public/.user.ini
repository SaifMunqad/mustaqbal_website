; PHP overrides for the shared-hosting document root (public_html).
; These are PHP_INI_PERDIR/ALL settings, so they apply without any server
; restart or sudo. They stop heavy screens (e.g. the page builder, which
; renders a live preview of every block) from tripping a low per-request limit
; and returning a 502 Bad Gateway. Values are conservative for shared hosting.

max_execution_time = 300
max_input_time = 300
memory_limit = 256M
